name = "octobot-population"
main = "src/index.js"
compatibility_date = "2026-11-06"
workers_dev = true

[triggers]
crons = ["* * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "octobot-population"
database_id = "43515153-c667-4599-8a73-24824fa5f399"
migrations_dir = "migrations"

# Private bucket for the converted Goblin and High Elf models (see README.md). Create it first, or the deploy fails:
#   npx wrangler r2 bucket create octobot-models
[[r2_buckets]]
binding = "MODELS"
bucket_name = "octobot-models"
