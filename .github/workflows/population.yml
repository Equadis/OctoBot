name: Record population and publish graph
on:
  schedule:
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'octobot/population.py'
      - '.github/workflows/population.yml'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: population-pages
  cancel-in-progress: false
jobs:
  collect-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      POPULATION_YSHAARJ_URL: ${{ vars.POPULATION_YSHAARJ_URL }}
      POPULATION_CTHUN_URL: ${{ vars.POPULATION_CTHUN_URL }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Record the current population
        run: python -m octobot.population --all
      - name: Persist observations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/online-history.json docs/history
          if ! git diff --cached --quiet; then
            git commit -m 'Record population observation [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
          retention-days: 1
      - name: Publish graph and history
        id: deployment
        uses: actions/deploy-pages@v4
