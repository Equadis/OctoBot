name: Record population and publish graph
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'octobot/population.py'
      - '.github/workflows/population.yml'
permissions:
  contents: read
jobs:
  collect:
    name: Collect population
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: population-history-write
      cancel-in-progress: false
    env:
      POPULATION_YSHAARJ_URL: ${{ vars.POPULATION_YSHAARJ_URL }}
      POPULATION_CTHUN_URL: ${{ vars.POPULATION_CTHUN_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check status history handling
        run: python -m unittest discover -s tests -p 'test_status_collector.py'
      - name: Test historical bot archive exporter
        run: python -m unittest discover -s tests -p 'test_export_status_history.py'
      - name: Test historical dashboard rendering
        run: node --test tests/status-archive.test.mjs tests/status-interactions.test.mjs
      - name: Record the current population
        run: python -m octobot.population --all
      - name: Persist observations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/online-history.json docs/history docs/live.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record population observation [skip ci]'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
