name: Import authorised World Buff Tracker
on:
  push:
    branches:
      - feat/world-buff-tracker-nzoth
    paths:
      - .github/workflows/import-world-buff-tracker.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vendor-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Check out OctoBot feature branch
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - name: Fetch pinned upstream source
        shell: bash
        run: |
          set -euo pipefail
          git init /tmp/onyxia-upstream
          git -C /tmp/onyxia-upstream remote add origin https://github.com/GeneralA6/octo-wow-world-buff-status.git
          git -C /tmp/onyxia-upstream fetch --depth=1 origin eb9f55952c4e75e2e9f7e38469895b1253c9e49c
          git -C /tmp/onyxia-upstream checkout --detach FETCH_HEAD
          test "$(git -C /tmp/onyxia-upstream rev-parse HEAD)" = "eb9f55952c4e75e2e9f7e38469895b1253c9e49c"
          mkdir -p services/world-buff-tracker
          rsync -a --exclude .git /tmp/onyxia-upstream/ services/world-buff-tracker/
      - name: Install Node.js and validate upstream build
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/world-buff-tracker/package-lock.json
      - name: Check source type safety, tests and build
        working-directory: services/world-buff-tracker
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
      - name: Commit full imported source on feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/world-buff-tracker
          if ! git diff --cached --quiet; then
            git commit -m "Vendor GeneralA6 tracker at eb9f559 [skip ci]"
            git push origin HEAD:feat/world-buff-tracker-nzoth
          fi
