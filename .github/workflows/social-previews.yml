name: Generate OctoBot link previews
on:
  push:
    branches: [main]
    paths:
      - 'tools/generate-social-previews.py'
      - '.github/workflows/social-previews.yml'
      - 'docs/favicon.png'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image renderer
        run: python -m pip install Pillow==11.3.0
      - name: Render seven Open Graph images
        run: python tools/generate-social-previews.py
      - name: Publish images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/social/*.png
          if git diff --cached --quiet; then
            echo "Preview images already up to date."
            exit 0
          fi
          git commit -m "Generate branded social preview cards [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
