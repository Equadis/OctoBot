name: Audit public OctoWoW population endpoints
on:
  push:
    paths:
      - '.github/workflows/realm-source-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect publicly served census and homepage JavaScript references
        shell: bash
        run: |
          python - <<'PY'
          import re
          from urllib.parse import urljoin,urlparse
          from urllib.request import Request,urlopen
          def get(url):
              req=Request(url,headers={'User-Agent':'OctoBot-FeedResearch/1.0','Accept':'text/html,application/javascript,*/*'})
              with urlopen(req,timeout=15) as r:
                  return r.read(4_000_000).decode('utf-8',errors='replace')
          for base in ['https://octowow.st/player-census','https://octowow.st/']:
              try:
                  html=get(base)
              except Exception as e:
                  print('ERROR',base,type(e).__name__,str(e)[:120])
                  continue
              print('PAGE',base,'bytes',len(html))
              scripts=[urljoin(base,s) for s in re.findall(r'<script\b[^>]*\bsrc\s*=\s*["\']([^"\']+)',html,re.I)]
              print('SCRIPTS',scripts[:30])
              if '/player-census' in base:
                  from html import unescape
                  decoded=unescape(html)
                  print('LIVE_COUNTER_CONTEXT',re.sub(r'\s+',' ',decoded[max(0,decoded.find('census-online-now')-1000):decoded.find('census-online-now')+850]))
                  for snapshot in re.findall(r'wire:snapshot="([^"]+)"',html):
                      try:
                          import json
                          d=json.loads(unescape(snapshot))
                          print('LIVEWIRE_SNAPSHOT',d.get('memo',{}).get('name'),[(key,type(value).__name__,str(value)[:80]) for key,value in d.get('data',{}).items()][:25])
                      except Exception as e: print('SNAPSHOT_PARSE_ERROR',type(e).__name__)
                  for phrase in ['census-online-now','online now','onlineNow','updateOnline','online-count','online_count','players-online']:
                      occurrences=list(re.finditer(re.escape(phrase),decoded,re.I))
                      print('HTML_OCCURRENCES',phrase,len(occurrences))
                      for m in occurrences[-5:]:
                          print('HTML_ONLINE_SOURCE',phrase,re.sub(r'\s+',' ',decoded[max(0,m.start()-160):m.end()+200])[:360])

                  for match in list(re.finditer(r'wire:(?:click|poll|model)[^>]{0,280}|<[^>]{0,350}(?:census-online|census-realm|census-tab)[^>]*>',decoded,re.I))[:80]:
                      print('CENSUS_ELEMENT',re.sub(r'\s+',' ',match.group(0))[:350])
                  for phrase in ['Y\'Shaarj','C\'Thun','N\'Zoth','onlineCount','online_count','realmId','realm_id','onlineTotal','online_now','wire:snapshot','wire:poll','livewire']:
                      for m in list(re.finditer(re.escape(phrase),decoded,re.I))[:5]:
                          print('CENSUS_MATCH',phrase,re.sub(r'\s+',' ',decoded[max(0,m.start()-100):m.end()+240])[:360])

              for phrase in ['Players online now','N\'Zoth','Y\'Shaarj','C\'Thun','/api/','realmPopulation','serverStatus','onlineCount','player-census']:
                  i=html.lower().find(phrase.lower())
                  if i>=0: print('HTML_MATCH',phrase,re.sub(r'\s+',' ',html[max(0,i-130):i+220])[:400])
              for script in scripts[:20]:
                  if urlparse(script).hostname not in ['octowow.st','www.octowow.st']: continue
                  try: js=get(script)
                  except Exception as e:
                      print('JS_ERROR',script,type(e).__name__,str(e)[:100]);continue
                  print('SCRIPT',script,'bytes',len(js))
                  candidates=r'fetch\s*\(|axios\.|/api/[A-Za-z0-9_/?=&.%:-]+|/player-census[A-Za-z0-9_/?=&.%:-]*|onlineCount|totalOnline|realm(s)?/|player[s_ -]?online|Y.Shaarj|C.Thun|N.Zoth'
                  matches=list(re.finditer(candidates,js,re.I))[:50]
                  print('JS_MATCH_COUNT_SHOWN',len(matches))
                  for match in matches:
                      snippet=re.sub(r'\s+',' ',js[max(0,match.start()-100):match.end()+130])
                      print('JS_MATCH',snippet[:350])
          PY
