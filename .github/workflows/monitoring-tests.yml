name: Validate OctoBot monitoring and charts

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'tools/**'
      - 'octotracker/status.py'
      - 'octotracker/auth.py'
      - 'octobot/**'
      - 'tests/**'
      - 'cloudflare/population/**'
      - '.github/workflows/monitoring-tests.yml'
  push:
    branches: [main]
    paths:
      - 'tools/**'
      - 'octotracker/status.py'
      - 'octotracker/auth.py'
      - 'octobot/**'
      - 'tests/**'
      - 'cloudflare/population/**'
      - '.github/workflows/monitoring-tests.yml'

permissions:
  contents: read

jobs:
  test:
    name: Unit and UI regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install monitoring test dependencies
        run: python -m pip install -r requirements.txt
      - name: Test independent status collector
        run: python -m unittest discover -s tests -p 'test_status_collector.py'
      - name: Test archive exporter
        run: python -m unittest discover -s tests -p 'test_export_status_history.py'
      - name: Test dashboard rendering and interactions
        run: node --test tests/status-archive.test.mjs tests/status-interactions.test.mjs tests/dashboard-cleanliness.test.mjs
      - name: Test nine-class planner, build library contracts and viewers
        run: node --test tests/sim/*.test.mjs tests/viewer-presence.test.mjs
      - name: Test official simulator data importers
        run: python -m unittest discover -s tests/sim -p 'test_*.py'
      - name: Test All Realms census reclassification
        run: python -m unittest discover -s tests -p 'test_population_reclassification.py'
      - name: Test Discord /serverinfo options and links
        run: python -m unittest discover -s tests -p 'test_serverinfo.py'
      - name: Test real Population history backfill
        run: node --test tests/population-history.test.mjs tests/population-live.test.mjs tests/uptime-clock.test.mjs
      - name: Test Cloudflare Worker
        working-directory: cloudflare/population
        run: npm test
