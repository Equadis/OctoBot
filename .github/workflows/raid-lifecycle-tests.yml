name: Raid lifecycle validation
on:
  pull_request:
    paths:
      - 'services/world-buff-tracker/**'
      - 'cloudflare/octometrics/**'
      - 'docs/world-info*'
      - 'tests/world-info*.test.mjs'
      - '.github/workflows/raid-lifecycle-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  raid:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: services/world-buff-tracker/package-lock.json
      - name: Worker raid lifecycle regression
        run: node --test cloudflare/octometrics/tests/raid-sessions.test.mjs
      - name: World Info raid and alert regression
        run: node --test tests/world-info-raids.test.mjs tests/world-info-text.test.mjs tests/world-info-heads.test.mjs tests/world-info-drops.test.mjs tests/raid-sounds.test.mjs
      - name: Install tracker dependencies
        working-directory: services/world-buff-tracker
        run: npm ci
      - name: Tracker typecheck
        working-directory: services/world-buff-tracker
        run: npm run typecheck
      - name: Tracker complete regression
        working-directory: services/world-buff-tracker
        run: npm test
      - name: Tracker build
        working-directory: services/world-buff-tracker
        run: npm run build
