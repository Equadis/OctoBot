name: Backup Auction D1 to private R2
on:
  workflow_dispatch:
    inputs:
      confirm_backup:
        description: 'Type BACKUP to export the production D1 database to private R2'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: octometrics-auction-backup
  cancel-in-progress: false
jobs:
  backup:
    if: inputs.confirm_backup == 'BACKUP'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID || '823592d7e68e3220a2b75f3f9c72515e' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify credentials and private destination
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN secret"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing CLOUDFLARE_ACCOUNT_ID variable"; exit 1; }
          cat > /tmp/octometrics-d1.json <<'EOF'
          {
            "name": "octometrics-auction-backup",
            "d1_databases": [{
              "binding": "DB",
              "database_name": "octometrics",
              "database_id": "da0b3776-63c8-41b0-8e7a-756fe20b33b0"
            }]
          }
          EOF
          npx --yes wrangler@4.166.0 r2 bucket list --json > /tmp/r2-buckets.json
          node -e 'const fs=require("fs");const d=JSON.parse(fs.readFileSync("/tmp/r2-buckets.json"));if(!Array.isArray(d)||!d.some(x=>x.name==="octobot-auction-snapshots"))throw Error("R2 bucket inaccessible or missing");'
          df -h /tmp
      - name: Export D1 SQL on the runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/auction-backup
          npx --yes wrangler@4.166.0 d1 export octometrics --remote --config /tmp/octometrics-d1.json --output=/tmp/auction-backup/octometrics.sql
          test -s /tmp/auction-backup/octometrics.sql
          sha256sum /tmp/auction-backup/octometrics.sql | tee /tmp/auction-backup/sha256.txt
          ls -lh /tmp/auction-backup/octometrics.sql
      - name: Archive backup privately to R2
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/auction-backup
          gzip -1 octometrics.sql
          sha256sum octometrics.sql.gz | tee sha256-gzip.txt
          split -b 100M -d -a 4 octometrics.sql.gz part-
          prefix="backups/d1-20261122-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          printf '%s\n' "$prefix" > r2-prefix.txt
          for file in part-* sha256.txt sha256-gzip.txt; do
            npx --yes wrangler@4.166.0 r2 object put "octobot-auction-snapshots/$prefix/$file" --file "$file" --remote
          done
          printf '%s\n' "Cloud backup objects uploaded to private R2 prefix: $prefix"
          echo "Retain the complete set of parts, both checksum files and the source D1 database."
          echo "No production auction configuration was changed."
