name: Monitor OctoWoW server status

# Independent of population collection and dashboard test failures.
# GitHub cron is best-effort and cannot guarantee uninterrupted five-minute checks.
on:
  schedule:
    # Offset from the start of the hour to avoid GitHub's busiest cron minute.
    - cron: '2-57/5 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/collect_status.py'
      - 'octotracker/status.py'
      - 'octotracker/auth.py'
      - '.github/workflows/status.yml'

permissions:
  contents: write

concurrency:
  group: octobot-status-publisher
  cancel-in-progress: false

jobs:
  probe:
    name: Collect independent service health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install status probe dependencies
        run: python -m pip install aiohttp beautifulsoup4
      - name: Collect official realms, TCP and authentication
        run: python -m tools.collect_status
      - name: Publish recorded status only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/status/latest.json docs/status/history.json
          if git diff --cached --quiet; then
            echo 'No new observation'
            exit 0
          fi
          git commit -m 'Record service health observation [skip ci]'
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Published health observation on attempt $attempt"
              exit 0
            fi
            sleep 2
          done
          echo 'Unable to publish collected observation' >&2
          exit 1
